<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mark Adel</title>

    <style>
        body{
            margin:0;
            background:#0d1117;
            color:white;
            font-family:Arial, Helvetica, sans-serif;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;
        }

        .card{
            width:360px;
            background:#161b22;
            border-radius:20px;
            padding:40px;
            text-align:center;
            box-shadow:0 15px 40px rgba(0,0,0,.45);
        }

        .photo{
            width:120px;
            height:120px;
            border-radius:50%;
            background:#d4af37;
            margin:auto;
            margin-bottom:25px;
        }

        h1{
            margin:0;
        }

        h2{
            margin-top:8px;
            color:#d4af37;
            font-size:18px;
            font-weight:normal;
        }

        p{
            color:#cccccc;
        }

        button{
            margin-top:25px;
            width:100%;
            height:50px;

            border:none;
            border-radius:10px;

            background:#d4af37;
            color:black;
            font-size:18px;
            cursor:pointer;
        }
    </style>

</head>

<body>

<div class="card">

<div class="photo"></div>

<h1>Mark Adel</h1>

<h2>Program Director</h2>

<p>Coptic Hope Center</p>

<button>
Coming Soon
</button>

</div>

</body>

</html>
