<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Contact Card</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <main class="page-shell">

    <section class="contact-card">

      <div class="ambient ambient-top"></div>
      <div class="ambient ambient-bottom"></div>

      <div class="profile-section">

        <div class="photo-frame">
          <img
            id="profilePhoto"
            class="profile-photo"
            src=""
            alt="Profile photo"
          >
        </div>

        <h1 id="profileName" class="profile-name"></h1>

        <p id="profileTitle" class="profile-title"></p>

        <p id="profileOrganization" class="profile-organization"></p>

        <p id="profileLocation" class="profile-location"></p>

      </div>

      <a
        id="saveContactButton"
        class="save-contact-button"
        href="#"
        download
      >
        <span class="button-icon">↓</span>
        <span>Save Contact</span>
      </a>

      <div class="action-grid">

        <a id="callButton" class="action-card" href="#">
          <span class="action-icon">☎</span>
          <span class="action-label">Call</span>
        </a>

        <a id="whatsappButton" class="action-card" href="#" target="_blank" rel="noopener">
          <span class="action-icon">◉</span>
          <span class="action-label">WhatsApp</span>
        </a>

        <a id="emailButton" class="action-card" href="#">
          <span class="action-icon">✉</span>
          <span class="action-label">Email</span>
        </a>

        <a id="linkedinButton" class="action-card" href="#" target="_blank" rel="noopener">
          <span class="action-icon linkedin-icon">in</span>
          <span class="action-label">LinkedIn</span>
        </a>

        <a id="websiteButton" class="action-card action-card-wide" href="#" target="_blank" rel="noopener">
          <span class="action-icon">◎</span>
          <span class="action-label">Website</span>
        </a>

      </div>

      <p id="profileTagline" class="profile-tagline"></p>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
